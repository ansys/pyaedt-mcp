name: Build Windows MCP Executable

on:
  release:
    types:
      - published

concurrency:
  group: release-windows-installer-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-windows-executable:
    name: Build and upload Windows executable
    runs-on: windows-latest
    permissions:
      contents: write # Needed to upload the Windows executable to the release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Stage embedded runtime
        shell: pwsh
        run: python .\desktop_app\stage_desktop_runtime.py

      - name: Build executable
        shell: pwsh
        run: uv run --group desktop flet pack .\desktop_app\desktop_launcher.py --name PyAEDT_MCP --icon .\desktop_app\assets\pyaedt_mcp_icon.ico --add-data .\desktop_app\.desktop-runtime:runtime --add-data .\desktop_app\assets:assets --yes

      - name: Upload executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG .\dist\PyAEDT_MCP.exe --clobber
