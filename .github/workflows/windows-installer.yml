name: Build Windows MCP Installer

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.release.id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # Needed to upload the Windows installer to a release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false

      - name: Install build dependencies
        shell: pwsh
        run: uv sync --only-group desktop --no-install-project

      - name: Stage embedded runtime
        shell: pwsh
        run: uv run --no-sync .\desktop_app\stage_desktop_runtime.py

      - name: Build executable
        shell: pwsh
        run: uv run --no-sync flet pack .\desktop_app\desktop_launcher.py --name PyAEDT_MCP --icon .\desktop_app\assets\pyaedt_mcp_icon.ico --add-data .\desktop_app\.desktop-runtime:runtime --add-data .\desktop_app\assets:assets --yes

      - name: Upload executable artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: PyAEDT_MCP-windows
          path: dist/PyAEDT_MCP.exe
          if-no-files-found: error

      - name: Install NSIS
        if: github.event_name == 'release'
        shell: pwsh
        run: choco install nsis -y

      - name: Build installer
        if: github.event_name == 'release'
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ github.event.release.tag_name }}
        run: .\scripts\build_windows_installer.ps1 -SkipRuntimeStaging -SkipExecutableBuild -Version $env:PRODUCT_VERSION.TrimStart('v')

      - name: Upload installer to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG .\dist\PyAEDT-MCP-Installer-windows.exe --clobber
