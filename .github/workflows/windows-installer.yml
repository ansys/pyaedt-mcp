name: Build Windows MCP Executable

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - name: Install build dependencies
        shell: pwsh
        run: uv sync --only-group desktop --no-install-project

      - name: Stage embedded runtime
        shell: pwsh
        run: uv run --no-sync .\desktop_app\stage_desktop_runtime.py

      - name: Build executable
        shell: pwsh
        run: .\scripts\build_windows_installer.ps1 -SkipRuntimeStaging -ExecutableOnly

      - name: Upload executable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PyAEDT_MCP-windows
          path: dist/PyAEDT_MCP.exe
          if-no-files-found: error
